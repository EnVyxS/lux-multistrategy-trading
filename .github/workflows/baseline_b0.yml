name: baseline_b0

# Satu pecahan per jalan. Cakram runner ~14 GB, satu pecahan ~3,8-4,3 GB dalam
# tiga bagian tar, jadi semesta penuh TIDAK PERNAH dalam satu job.
#
# Gerbang byte WAJIB: `sha256sum -c SHA256SUMS` (saksi 1, alat GNU) DAN
# `lux_ms.dataset.gerbang_sidik` (saksi 2, hasil ukur sesi ini). Bila salah satu
# gagal, job gagal dan tidak ada angka hasil yang ditulis.
#
# PEMICU LEWAT PUSH (pola lux-ai-research/.github/workflows/pecahan_serapan.yml):
# agen tidak punya alat memicu workflow_dispatch, jadi jalan diminta dengan
# MENDORONG pemicu/baseline_b0.json. Hasil dikembalikan sebagai commit ke
# reports/ dengan `[skip ci]`, jadi bisa dibaca tanpa alat Actions apa pun.
#
# ANTI PEMICU-DIRI (padanan Aturan 33): alur ini TIDAK PERNAH menulis ke
# pemicu/**. Yang di-commit hanya reports/**.
#
# CACAT 1 (SUDAH DIPERBAIKI): pola aset rilis TERUKUR adalah
# `pecahan_<i>.partNN.tar`, BUKAN `serapan_pecahan_*`. Pola salah membuat unduhan
# hanya mengambil SHA256SUMS lalu job tampak sehat dengan nol data. Karena itu
# ada gerbang cacah tar di bawah.
#
# CACAT 2 (SEBAB VERSI INI): run 30659250441 (commit 6fb147c3, dipicu push
# pemicu) MATI sebelum TAG diset, dan yang ditinggalkannya hanya penanda dengan
# `tag: null` dan `kode_keluar_ukur: null`. Tidak ada cara menentukan langkah
# mana yang gagal, karena agen tidak punya alat pembaca log Actions. Itu cacat
# KEMAMPUAN-DIAGNOSA, bukan hasil. Perbaikannya: setiap langkah menulis namanya
# ke reports/b0_tahap.log, dan langkah unduh menyimpan keluarannya ke
# reports/b0_unduh.log lalu baru gagal. Dengan begitu kegagalan berikutnya
# meninggalkan bukti yang bisa dibaca lewat pembacaan berkas biasa.
#
# TERUKUR: EnVyxS/lux-ai-research bersifat PUBLIK (private=false), jadi
# GITHUB_TOKEN bawaan cukup untuk mengunduh aset rilisnya. LINTAS_REPO_TOKEN
# tetap didukung bila suatu saat repo itu diprivatkan.

on:
  push:
    paths:
      - 'pemicu/baseline_b0.json'
  workflow_dispatch:
    inputs:
      indeks:
        description: "indeks pecahan 0..7"
        required: true
        default: "7"
      batas_simbol:
        description: "0 = semua simbol pecahan itu"
        required: true
        default: "3"
      min_rr:
        description: "WAJIB; nilai legacy per-strategi BELUM DIUKUR"
        required: true
        default: "1.5"
      min_gap_r:
        description: "WAJIB"
        required: true
        default: "1.0"
      fallback_rr:
        description: "WAJIB"
        required: true
        default: "2.5"

permissions:
  contents: write

jobs:
  ukur:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TOKEN_LINTAS: ${{ secrets.LINTAS_REPO_TOKEN }}
      TOKEN_BAWAAN: ${{ secrets.GITHUB_TOKEN }}
      ID_RUN: ${{ github.run_id }}
      SHA_COMMIT: ${{ github.sha }}
      REPO_SUMBER: EnVyxS/lux-ai-research
      RUN_SERAPAN: "30396803601"
      TAHAP: reports/b0_tahap.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tahap 0 - siapkan jejak tahap
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo "run_id=$ID_RUN commit=$SHA_COMMIT event=$GITHUB_EVENT_NAME"
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 0 checkout+siap MASUK"
          } > "$TAHAP"
          df -h / >> "$TAHAP"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 0 SELESAI" >> "$TAHAP"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tahap 1 - dependensi dan batasan lingkungan
        run: |
          set -euo pipefail
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 1 dependensi MASUK" >> "$TAHAP"
          python -V >> "$TAHAP"
          gh --version >> "$TAHAP" 2>&1 || echo "gh tidak ada" >> "$TAHAP"
          jq --version >> "$TAHAP" 2>&1 || echo "jq tidak ada" >> "$TAHAP"
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow pyyaml pytest
          python - <<'PY'
          import importlib.util
          for m in ("scipy", "requests"):
              if importlib.util.find_spec(m) is not None:
                  raise SystemExit(f"PELANGGARAN LINGKUNGAN: {m} terpasang")
          print("lingkungan sesuai: tanpa scipy, tanpa requests")
          PY
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 1 SELESAI" >> "$TAHAP"

      - name: Tahap 2 - baca masukan (pemicu push atau workflow_dispatch)
        run: |
          set -euo pipefail
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 2 baca masukan MASUK" >> "$TAHAP"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            SUMBER="pemicu/baseline_b0.json"
            test -f "$SUMBER" || { echo "GAGAL: $SUMBER tidak ada padahal alur dipicu push" >&2; exit 1; }
            cat "$SUMBER"
            INDEKS=$(jq -r '.indeks' "$SUMBER")
            BATAS=$(jq -r '.batas_simbol' "$SUMBER")
            MIN_RR=$(jq -r '.min_rr' "$SUMBER")
            MIN_GAP=$(jq -r '.min_gap_r' "$SUMBER")
            FB=$(jq -r '.fallback_rr' "$SUMBER")
          else
            SUMBER="workflow_dispatch"
            INDEKS=$(jq -r '.inputs.indeks' "$GITHUB_EVENT_PATH")
            BATAS=$(jq -r '.inputs.batas_simbol' "$GITHUB_EVENT_PATH")
            MIN_RR=$(jq -r '.inputs.min_rr' "$GITHUB_EVENT_PATH")
            MIN_GAP=$(jq -r '.inputs.min_gap_r' "$GITHUB_EVENT_PATH")
            FB=$(jq -r '.inputs.fallback_rr' "$GITHUB_EVENT_PATH")
          fi
          case "$INDEKS" in 0|1|2|3|4|5|6|7) ;; *) echo "indeks di luar 0..7: $INDEKS" >&2; exit 1 ;; esac
          case "$BATAS" in ''|*[!0-9]*) echo "batas_simbol harus bilangan bulat >= 0: $BATAS" >&2; exit 1 ;; esac
          for pasang in "min_rr=$MIN_RR" "min_gap_r=$MIN_GAP" "fallback_rr=$FB"; do
            nilai="${pasang#*=}"
            case "$nilai" in
              ''|null) echo "GAGAL: ${pasang%%=*} kosong. Nilai legacy BELUM DIUKUR dan tidak boleh ditebak oleh alur." >&2; exit 1 ;;
            esac
            printf '%s' "$nilai" | grep -Eq '^[0-9]+(\.[0-9]+)?$' || { echo "GAGAL: ${pasang%%=*} bukan angka desimal: $nilai" >&2; exit 1; }
          done
          {
            echo "SUMBER_MASUKAN=$SUMBER"
            echo "INDEKS=$INDEKS"
            echo "BATAS=$BATAS"
            echo "MIN_RR=$MIN_RR"
            echo "MIN_GAP=$MIN_GAP"
            echo "FB=$FB"
          } >> "$GITHUB_ENV"
          echo "masukan: indeks=$INDEKS batas=$BATAS min_rr=$MIN_RR min_gap_r=$MIN_GAP fallback_rr=$FB sumber=$SUMBER" >> "$TAHAP"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 2 SELESAI" >> "$TAHAP"

      - name: Tahap 3 - uji harness harus lulus SEBELUM data diunduh
        run: |
          set -euo pipefail
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 3 uji MASUK" >> "$TAHAP"
          set +e
          pytest -q tests > uji_pytest.log 2>&1
          KODE_PYTEST=$?
          python jalankan_uji.py > uji_plain.log 2>&1
          KODE_PLAIN=$?
          set -e
          tail -c 8000 uji_pytest.log >> "$TAHAP"
          tail -n 3 uji_plain.log >> "$TAHAP"
          echo "kode_pytest=$KODE_PYTEST kode_plain=$KODE_PLAIN" >> "$TAHAP"
          if [ "$KODE_PYTEST" -ne 0 ] || [ "$KODE_PLAIN" -ne 0 ]; then
            echo "GAGAL: uji harness tidak lulus; tidak ada data yang diunduh dan tidak ada angka yang ditulis." >&2
            exit 1
          fi
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 3 SELESAI" >> "$TAHAP"

      - name: Tahap 4 - unduh aset rilis pecahan
        run: |
          set -euo pipefail
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 4 unduh MASUK" >> "$TAHAP"
          TAG="serapan-pecahan-${INDEKS}-${RUN_SERAPAN}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG repo_sumber=$REPO_SUMBER" >> "$TAHAP"
          if [ -n "${TOKEN_LINTAS:-}" ]; then
            export GH_TOKEN="$TOKEN_LINTAS"
            echo "token: LINTAS_REPO_TOKEN" >> "$TAHAP"
          else
            export GH_TOKEN="$TOKEN_BAWAAN"
            echo "token: GITHUB_TOKEN bawaan (cukup; repo sumber TERUKUR publik)" >> "$TAHAP"
          fi
          mkdir -p data/rilis
          set +e
          gh release view "$TAG" --repo "$REPO_SUMBER" --json assets --jq '.assets[] | [.name, .size] | @tsv' > unduh.log 2>&1
          KODE_LIHAT=$?
          gh release download "$TAG" --repo "$REPO_SUMBER" --dir data/rilis \
            --pattern "pecahan_${INDEKS}.part*.tar" --pattern 'SHA256SUMS' --clobber >> unduh.log 2>&1
          KODE_UNDUH=$?
          set -e
          tail -c 30000 unduh.log > reports/b0_unduh.log
          {
            echo "kode_lihat=$KODE_LIHAT kode_unduh=$KODE_UNDUH"
            ls -l data/rilis 2>&1 || true
            df -h / || true
          } >> "$TAHAP"
          if [ "$KODE_LIHAT" -ne 0 ] || [ "$KODE_UNDUH" -ne 0 ]; then
            echo "GAGAL UNDUH. Lihat reports/b0_unduh.log. Tidak ada jalur 'anggap benar'." >&2
            exit 1
          fi
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 4 SELESAI" >> "$TAHAP"

      - name: Tahap 5 - gerbang cacah tar (nol tar = pola aset salah)
        run: |
          set -euo pipefail
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 5 gerbang tar MASUK" >> "$TAHAP"
          CACAH=$(find data/rilis -maxdepth 1 -name 'pecahan_*.tar' | wc -l)
          echo "cacah_tar=$CACAH" >> "$TAHAP"
          if [ "$CACAH" -lt 1 ]; then
            echo "GAGAL: tidak ada tar terunduh; pola aset tidak cocok. Bandingkan dengan daftar aset di reports/b0_unduh.log." >&2
            exit 1
          fi
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 5 SELESAI" >> "$TAHAP"

      - name: Tahap 6 - saksi 1, sha256sum -c SHA256SUMS
        run: |
          set -euo pipefail
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 6 saksi 1 MASUK" >> "$TAHAP"
          cd data/rilis
          test -f SHA256SUMS || { echo "SHA256SUMS tidak ada"; exit 1; }
          cat SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS | tee -a "../../$TAHAP"
          sha256sum SHA256SUMS >> "../../$TAHAP"
          cd ../..
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 6 SELESAI" >> "$TAHAP"

      - name: Tahap 7 - saksi 2, gerbang_sidik, bongkar, dan ukur B0
        run: |
          set -euo pipefail
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 7 ukur MASUK" >> "$TAHAP"
          set +e
          python ukur_b0.py \
            --indeks "$INDEKS" \
            --akar-rilis data/rilis \
            --akar-bongkar . \
            --batas-simbol "$BATAS" \
            --min-rr "$MIN_RR" \
            --min-gap-r "$MIN_GAP" \
            --fallback-rr "$FB" \
            --hapus-tar \
            --keluaran "reports/b0_pecahan${INDEKS}_status.json" > ukur.log 2>&1
          KODE=$?
          set -e
          tail -c 40000 ukur.log > "reports/b0_pecahan${INDEKS}.log"
          echo "KODE_UKUR=$KODE" >> "$GITHUB_ENV"
          echo "kode_ukur=$KODE" >> "$TAHAP"
          tail -n 40 ukur.log
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 7 SELESAI kode=$KODE" >> "$TAHAP"
          exit $KODE

      - name: Tahap 8 - cakram dan cacah parquet setelah bongkar
        if: always()
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 8 sisa cakram MASUK" >> "$TAHAP" || true
          df -h / >> "$TAHAP" 2>&1 || true
          find data/parquet -name '*.parquet' 2>/dev/null | wc -l >> "$TAHAP" || true

      - name: Tahap 9 - tulis penanda jalan dan commit laporan
        if: always()
        run: |
          set -euo pipefail
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) TAHAP 9 penanda MASUK" >> "$TAHAP" || true
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("reports")
          p.mkdir(parents=True, exist_ok=True)
          jejak = p / "b0_tahap.log"
          baris = jejak.read_text(encoding="utf-8", errors="replace").splitlines() if jejak.exists() else []
          tahap = [b for b in baris if " TAHAP " in b]
          isi = {
              "bukan_bukti": False,
              "alur": "baseline_b0",
              "run_id": os.environ.get("ID_RUN"),
              "commit": os.environ.get("SHA_COMMIT"),
              "tag": os.environ.get("TAG"),
              "indeks": os.environ.get("INDEKS"),
              "sumber_masukan": os.environ.get("SUMBER_MASUKAN"),
              "kode_keluar_ukur": os.environ.get("KODE_UKUR"),
              "tahap_terakhir": tahap[-1] if tahap else None,
              "cacah_baris_jejak": len(baris),
              "parameter": {
                  "batas_simbol": os.environ.get("BATAS"),
                  "min_rr": os.environ.get("MIN_RR"),
                  "min_gap_r": os.environ.get("MIN_GAP"),
                  "fallback_rr": os.environ.get("FB"),
              },
              "nilai_basi_yang_ditolak": {
                  "run": "30628719235",
                  "commit": "95021cda",
                  "blob": "fedd1e89",
              },
              "status_angka": (
                  "Isi reports/ hanya sah bila kedua saksi sidik LULUS. Angka B0 "
                  "masih BATAS ATAS: gerbang trendline_min_htf_score=3 sudah "
                  "diport di lux_ms/htf.py tetapi BELUM disambungkan ke "
                  "pindai_b0, dan SL masih PENDEKATAN_B0."
              ),
              "patokan": "EnVyxS/lux-multistrategy-trading",
          }
          (p / "b0_jalan_terakhir.json").write_text(
              json.dumps(isi, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -m "reports: laporan baseline_b0 pecahan ${INDEKS:-?} run ${ID_RUN} [skip ci]" || echo "tidak ada perubahan"
          for percobaan in 1 2 3 4; do
            git pull --rebase --autostash && git push && break
            sleep $((percobaan * 10))
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laporan-baseline-b0
          path: reports/
          if-no-files-found: warn
