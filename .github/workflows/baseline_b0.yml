name: baseline_b0

# Satu pecahan per jalan. Cakram runner ~14 GB, satu pecahan ~3,8-4,3 GB dalam
# tiga bagian tar, jadi semesta penuh TIDAK PERNAH dalam satu job.
#
# Gerbang byte WAJIB: `sha256sum -c SHA256SUMS` (saksi 1, alat GNU) DAN
# `lux_ms.dataset.gerbang_sidik` (saksi 2, hasil ukur sesi ini). Bila salah satu
# gagal, job gagal dan tidak ada angka hasil yang ditulis.
#
# PEMICU LEWAT PUSH (pola yang dipakai lux-ai-research/.github/workflows/
# pecahan_serapan.yml): agen tidak punya alat memicu workflow_dispatch, jadi
# jalan diminta dengan MENDORONG berkas pemicu/baseline_b0.json. Berkas itu
# sekaligus menjadi catatan parameter yang diminta, dapat dibaca ulang dan
# di-diff. Hasil dikembalikan dengan cara yang sama seperti repo riset: job
# meng-commit reports/*.json ke cabang yang sama dengan `[skip ci]`, sehingga
# hasilnya bisa dibaca lewat get_file_contents tanpa alat Actions apa pun.
#
# ANTI PEMICU-DIRI (padanan Aturan 33): alur ini TIDAK PERNAH menulis ke
# pemicu/**. Yang di-commit hanya reports/**.
#
# CACAT YANG SUDAH DIPERBAIKI (jangan diulang): pola aset rilis yang TERUKUR
# adalah `pecahan_<i>.partNN.tar` dan `pecahan_<i>_karantina.partNN.tar`, BUKAN
# `serapan_pecahan_*`. Pola salah membuat `gh release download` hanya mengambil
# SHA256SUMS lalu job berjalan seolah-olah baik-baik saja. Karena itu ada
# gerbang cacah tar di bawah: nol tar = job GAGAL.

on:
  push:
    paths:
      - 'pemicu/baseline_b0.json'
  workflow_dispatch:
    inputs:
      indeks:
        description: "indeks pecahan 0..7"
        required: true
        default: "7"
      batas_simbol:
        description: "0 = semua simbol pecahan itu"
        required: true
        default: "3"
      min_rr:
        description: "WAJIB; nilai legacy per-strategi BELUM DIUKUR"
        required: true
        default: "1.5"
      min_gap_r:
        description: "WAJIB"
        required: true
        default: "1.0"
      fallback_rr:
        description: "WAJIB"
        required: true
        default: "2.5"

permissions:
  contents: write

jobs:
  ukur:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TOKEN_LINTAS: ${{ secrets.LINTAS_REPO_TOKEN }}
      TOKEN_BAWAAN: ${{ secrets.GITHUB_TOKEN }}
      ID_RUN: ${{ github.run_id }}
      SHA_COMMIT: ${{ github.sha }}
      REPO_SUMBER: EnVyxS/lux-ai-research
      RUN_SERAPAN: "30396803601"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang dependensi dan tegakkan batasan lingkungan
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow pyyaml pytest
          python - <<'PY'
          import importlib.util
          for m in ("scipy", "requests"):
              if importlib.util.find_spec(m) is not None:
                  raise SystemExit(f"PELANGGARAN LINGKUNGAN: {m} terpasang")
          print("lingkungan sesuai: tanpa scipy, tanpa requests")
          PY

      - name: Baca masukan (pemicu push atau workflow_dispatch)
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            SUMBER="pemicu/baseline_b0.json"
            test -f "$SUMBER" || { echo "GAGAL: $SUMBER tidak ada padahal alur dipicu push" >&2; exit 1; }
            echo "--- isi $SUMBER ---"
            cat "$SUMBER"
            INDEKS=$(jq -r '.indeks' "$SUMBER")
            BATAS=$(jq -r '.batas_simbol' "$SUMBER")
            MIN_RR=$(jq -r '.min_rr' "$SUMBER")
            MIN_GAP=$(jq -r '.min_gap_r' "$SUMBER")
            FB=$(jq -r '.fallback_rr' "$SUMBER")
          else
            SUMBER="workflow_dispatch"
            INDEKS=$(jq -r '.inputs.indeks' "$GITHUB_EVENT_PATH")
            BATAS=$(jq -r '.inputs.batas_simbol' "$GITHUB_EVENT_PATH")
            MIN_RR=$(jq -r '.inputs.min_rr' "$GITHUB_EVENT_PATH")
            MIN_GAP=$(jq -r '.inputs.min_gap_r' "$GITHUB_EVENT_PATH")
            FB=$(jq -r '.inputs.fallback_rr' "$GITHUB_EVENT_PATH")
          fi
          case "$INDEKS" in 0|1|2|3|4|5|6|7) ;; *) echo "indeks di luar 0..7: $INDEKS" >&2; exit 1 ;; esac
          case "$BATAS" in ''|*[!0-9]*) echo "batas_simbol harus bilangan bulat >= 0: $BATAS" >&2; exit 1 ;; esac
          for pasang in "min_rr=$MIN_RR" "min_gap_r=$MIN_GAP" "fallback_rr=$FB"; do
            nilai="${pasang#*=}"
            case "$nilai" in
              ''|null) echo "GAGAL: ${pasang%%=*} kosong. Nilai legacy BELUM DIUKUR dan tidak boleh ditebak oleh alur." >&2; exit 1 ;;
            esac
            printf '%s' "$nilai" | grep -Eq '^[0-9]+(\.[0-9]+)?$' || { echo "GAGAL: ${pasang%%=*} bukan angka desimal: $nilai" >&2; exit 1; }
          done
          echo "SUMBER_MASUKAN=$SUMBER" >> "$GITHUB_ENV"
          echo "INDEKS=$INDEKS" >> "$GITHUB_ENV"
          echo "BATAS=$BATAS" >> "$GITHUB_ENV"
          echo "MIN_RR=$MIN_RR" >> "$GITHUB_ENV"
          echo "MIN_GAP=$MIN_GAP" >> "$GITHUB_ENV"
          echo "FB=$FB" >> "$GITHUB_ENV"
          echo "masukan: indeks=$INDEKS batas=$BATAS min_rr=$MIN_RR min_gap_r=$MIN_GAP fallback_rr=$FB sumber=$SUMBER"

      - name: Uji harness harus lulus SEBELUM data diunduh
        run: |
          set -euo pipefail
          pytest -q tests
          python jalankan_uji.py

      - name: Cakram sebelum unduh
        run: df -h /

      - name: Unduh aset rilis pecahan
        run: |
          set -euo pipefail
          TAG="serapan-pecahan-${INDEKS}-${RUN_SERAPAN}"
          echo "tag=$TAG"
          if [ -n "${TOKEN_LINTAS:-}" ]; then
            export GH_TOKEN="$TOKEN_LINTAS"
            echo "token: LINTAS_REPO_TOKEN"
          else
            export GH_TOKEN="$TOKEN_BAWAAN"
            echo "token: GITHUB_TOKEN bawaan (hanya cukup bila $REPO_SUMBER publik)"
          fi
          mkdir -p data/rilis
          gh release view "$TAG" --repo "$REPO_SUMBER" --json assets --jq '.assets[] | [.name, .size] | @tsv'
          if ! gh release download "$TAG" --repo "$REPO_SUMBER" --dir data/rilis \
              --pattern "pecahan_${INDEKS}.part*.tar" --pattern 'SHA256SUMS' --clobber; then
            echo "GAGAL UNDUH: bila $REPO_SUMBER privat, sediakan secret LINTAS_REPO_TOKEN (scope repo). Tidak ada jalur 'anggap benar'." >&2
            exit 1
          fi
          ls -l data/rilis
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Gerbang cacah tar (nol tar = pola aset salah)
        run: |
          set -euo pipefail
          CACAH=$(find data/rilis -maxdepth 1 -name 'pecahan_*.tar' | wc -l)
          echo "cacah tar terunduh: $CACAH"
          if [ "$CACAH" -lt 1 ]; then
            echo "GAGAL: tidak ada tar terunduh; pola aset tidak cocok. Bandingkan dengan daftar aset yang dicetak di langkah sebelumnya." >&2
            exit 1
          fi

      - name: Saksi 1 - sha256sum -c SHA256SUMS
        run: |
          set -euo pipefail
          cd data/rilis
          test -f SHA256SUMS || { echo "SHA256SUMS tidak ada"; exit 1; }
          cat SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          sha256sum SHA256SUMS

      - name: Saksi 2 - gerbang_sidik, bongkar, dan ukur B0
        run: |
          set -euo pipefail
          mkdir -p reports
          set +e
          python ukur_b0.py \
            --indeks "$INDEKS" \
            --akar-rilis data/rilis \
            --akar-bongkar . \
            --batas-simbol "$BATAS" \
            --min-rr "$MIN_RR" \
            --min-gap-r "$MIN_GAP" \
            --fallback-rr "$FB" \
            --hapus-tar \
            --keluaran "reports/b0_pecahan${INDEKS}_status.json" > ukur.log 2>&1
          KODE=$?
          set -e
          tail -c 40000 ukur.log > "reports/b0_pecahan${INDEKS}.log"
          echo "KODE_UKUR=$KODE" >> "$GITHUB_ENV"
          tail -n 40 ukur.log
          exit $KODE

      - name: Cakram dan cacah parquet setelah bongkar
        if: always()
        run: |
          df -h / || true
          find data/parquet -name '*.parquet' 2>/dev/null | wc -l || true

      - name: Tulis penanda jalan dan commit laporan
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("reports")
          p.mkdir(parents=True, exist_ok=True)
          isi = {
              "bukan_bukti": False,
              "alur": "baseline_b0",
              "run_id": os.environ.get("ID_RUN"),
              "commit": os.environ.get("SHA_COMMIT"),
              "tag": os.environ.get("TAG"),
              "indeks": os.environ.get("INDEKS"),
              "sumber_masukan": os.environ.get("SUMBER_MASUKAN"),
              "kode_keluar_ukur": os.environ.get("KODE_UKUR"),
              "parameter": {
                  "batas_simbol": os.environ.get("BATAS"),
                  "min_rr": os.environ.get("MIN_RR"),
                  "min_gap_r": os.environ.get("MIN_GAP"),
                  "fallback_rr": os.environ.get("FB"),
              },
              "nilai_basi_yang_ditolak": {
                  "run": "30628719235",
                  "commit": "95021cda",
                  "blob": "fedd1e89",
              },
              "status_angka": (
                  "Isi reports/ hanya sah bila kedua saksi sidik LULUS. Angka B0 "
                  "masih BATAS ATAS: gerbang trendline_min_htf_score=3 sudah "
                  "diport di lux_ms/htf.py tetapi BELUM disambungkan ke "
                  "pindai_b0, dan SL masih PENDEKATAN_B0."
              ),
              "patokan": "EnVyxS/lux-multistrategy-trading",
          }
          (p / "b0_jalan_terakhir.json").write_text(
              json.dumps(isi, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -m "reports: laporan baseline_b0 pecahan ${INDEKS:-?} run ${ID_RUN} [skip ci]" || echo "tidak ada perubahan"
          for percobaan in 1 2 3 4; do
            git pull --rebase --autostash && git push && break
            sleep $((percobaan * 10))
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laporan-baseline-b0
          path: reports/
          if-no-files-found: warn
